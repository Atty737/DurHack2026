{% extends "base.html" %}

{% block title %}Recipes{% endblock %}

{% block content %}
<div class="mb-3">
    <label for="budget" class="form-label">Budget for the week:</label>
    <input type="number" class="form-control" id="budget" aria-describedby="budgetHelp" placeholder="Enter budget">
    <div id="budgetHelp" class="form-text">All recipes will sum to less than the budget or will use items in your cupboard.</div>
</div>
<button id="genButton" type="button" class="btn btn-primary">
    <div id="genSpinner" class="spinner-border spinner-border-sm" role="status" style="display:none">
        <span class="visually-hidden">Loading...</span>
    </div>
    Generate Recipes
</button>

<script>
    document.getElementById("genButton").addEventListener("click", GenerateRecipes);
    async function GenerateRecipes(event) {
        document.getElementById("genSpinner").style.display = ""

        const params = new URLSearchParams({budget: document.getElementById("budget").value});

        const response = await fetch(`/api/recipeGenerate?${params}`);
        const data = await response.json();
        for (let i = 1; i < 8; i++){
            let id = "recipe" + i;
            let recipe = "<h2>" + data.recipeNames[i - 1] + "</h2><ul>";
            for (let j = 0; j < data.ingredients[i - 1].length; j++) {
                recipe = recipe + "<li>" + data.ingredients[i - 1][j] + "</li>";
            } 
            recipe = recipe +  "</ul><p class=\"d-inline-flex gap-1\"><button class=\"btn-solid theme-primary\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#collapseExample\" aria-expanded=\"false\" aria-controls=\"collapseExample\">Open Recipe</button></p><div class=\"collapse\" id=\"collapseExample\"><div class=\"card card-body\">" + data.links[i - 1] + "</div></div>";         
            document.getElementById(id).innerHTML = recipe;
        }

        document.getElementById("genSpinner").style.display = "none"
    }
</script>

<div id="recipe1"></div>
<div id="recipe2"></div>
<div id="recipe3"></div>
<div id="recipe4"></div>
<div id="recipe5"></div>
<div id="recipe6"></div>
<div id="recipe7"></div>
{% endblock %}
