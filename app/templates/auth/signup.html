{% extends "base.html" %}

{% block title %}Sign up | DurHack 2026{% endblock %}

{% block content %}
  <h2>Sign up</h2>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autocomplete="username">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password">

    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">

    <button type="submit">Sign up</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
