{% extends "base.html" %}

{% block title %}Sign up | Cooking{% endblock %}

{% block content %}
  <h2>Sign up</h2>
  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" name="username" type="text" class="form-control" required autocomplete="username">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email" class="form-control" required autocomplete="email">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" name="password" type="password" class="form-control" minlength="8" required autocomplete="new-password">
    </div>

    <div class="mb-3">
      <label for="confirm_password" class="form-label">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" class="form-control" minlength="8" required autocomplete="new-password">
    </div>

    <button type="submit" class="btn btn-primary">Sign up</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
