{% extends "base.html" %}

{% block title %}Find Nearest Shop | Weekly Meal Planner{% endblock %}

{% block content %}
<div id="container">
    <div id="sidebar">
        <h2>Find Nearest Shop</h2>
        <button id="nearestShopButton" type="button" class="btn btn-primary" onclick="findNearestShop()">
        <div id="nearestShopSpinner" class="spinner-border spinner-border-sm" role="status" style="display:none">
            <span class="visually-hidden">Loading...</span>
        </div>
        Find stores
        </button>
        <div id="store-list"></div>
    </div>
    <div id="map"></div>
</div>
<div>
    <input type="text" class="form-control" id="shopName" aria-describedby="shopName" placeholder="Enter shop name">
    <input type="text" class="form-control" id="address" aria-describedby="address" placeholder="Enter address">
    <input type="text" class="form-control" id="postcode" aria-describedby="postcode" placeholder="Enter post code">
    <input type="text" class="form-control" id="latitude" aria-describedby="latitude" placeholder="Enter latitude">
    <input type="text" class="form-control" id="longitude" aria-describedby="longitude" placeholder="Enter longitude">
    <button id="addButton" type="button" class="btn btn-primary">Add to DB</button>
    <script>
        document.getElementById("addButton").addEventListener("click", AddToDB)
        async function AddToDB(event){
            const params = new URLSearchParams({shopName: document.getElementById("shopName").value, address: document.getElementById("address").value, postcode: document.getElementById("postcode").value, latitude: document.getElementById("latitude").value, longitude: document.getElementById("longitude").value});
            console.log(params);
            ids = ["shopName", "address", "postcode", "latitude", "longitude"];
            for (let i = 0; i < 5; i++){
                document.getElementById(ids[i]).value = "";
            }
            const response = await fetch(`/addStore?${params}`);
        }
    </script>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    #container { 
        display: flex; 
        height: 600px; /* Gives the container a fixed height */
        width: 100%; 
    }
    #sidebar { 
        width: 350px; 
        overflow-y: auto; 
        box-sizing: border-box; 
        font-family: sans-serif; 
    }
    #map { 
        flex-grow: 1; 
        height: 100%; /* Forces the map to fill the remaining space */
    }
    .store-card { 
        padding: 10px; 
        margin-top: 4px;
        margin-bottom: 4px; 
        border: 1px solid #ddd; 
        border-radius: 4px; 
        cursor: pointer; 
    }
    .store-card:hover { 
        background-color: #f1f1f1; 
    }
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([51.5074, -0.1278], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = [];

    function loadStores(latitude = null, longitude = null) {
    let url = '/api/stores';
    if (latitude && longitude) { url += `?lat=${latitude}&lng=${longitude}`; }

    fetch(url)
        .then(response => response.json())
        .then(stores => {
            const listContainer = document.getElementById('store-list');
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            stores.forEach(store => {
                // Drop a pin on the map
                const marker = L.marker([store.latitude, store.longitude]).addTo(map)
                    .bindPopup(`<b>${store.name}</b><br>${store.address}`);
                markers.push(marker);

                // Build sidebar card elements dynamically
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `<strong>${store.name}</strong><br>${store.address}, ${store.postcode}` + 
                    (store.distance !== null ? `<br><small>Distance: ${store.distance} miles</small>` : '');
                
                // Clicking a card pans the map to that store
                card.onclick = () => {
                    map.setView([store.latitude, store.longitude], 15);
                    marker.openPopup();
                };
                listContainer.appendChild(card);
            });
        });
    }

    function findNearestShop() {
    document.getElementById("nearestShopSpinner").style.display = ""
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            // Center map on user and drop a marker
            map.setView([lat, lng], 13);
            L.marker([lat, lng], {
                icon: L.divIcon({className: 'user-marker', html: '📍', iconSize: [20, 20]})
            }).addTo(map).bindPopup("You are here").openPopup();

            // Reload stores sorted by user location
            loadStores(lat, lng);
            document.getElementById("nearestShopSpinner").style.display = "none"
        }, error => {
            alert("Unable to retrieve your location.");
        });
    }
    }
</script>

{% endblock %}
